name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Run tests
        run: yarn test

      - name: Build extension
        run: yarn build

      - name: Package .vsix
        run: yarn vsce package --no-dependencies -o opencode-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: opencode-vscode.vsix
