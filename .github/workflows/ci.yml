name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check context files with repoctx
        run: |
          VERSION=v0.5.0
          curl -sSLo /tmp/repoctx \
            "https://github.com/SrIruma/repoctx/releases/download/${VERSION}/repoctx_linux_amd64"
          chmod +x /tmp/repoctx
          /tmp/repoctx audit --check

      - name: Package .vsix
        run: npx vsce package --no-dependencies -o opencode-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: opencode-vscode.vsix
