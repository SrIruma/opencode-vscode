name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package .vsix
        run: npx vsce package --no-dependencies -o opencode-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: opencode-vscode.vsix
